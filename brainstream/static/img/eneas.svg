<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Enéas AI Tutor</title>
  <defs>
    <!-- Gradiente do capacete cerâmico -->
    <linearGradient id="bot-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Gradiente da viseira OLED -->
    <linearGradient id="bot-visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Brilho neon dos olhos -->
    <radialGradient id="eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#2EE6C5"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </radialGradient>
    <!-- Brilho ambiente no fundo -->
    <radialGradient id="bg-halo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2EE6C5" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06090F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6C5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro circular -->
  <circle cx="32" cy="32" r="32" fill="#070A12"/>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>
  <circle cx="32" cy="30" r="22" fill="url(#bg-halo)"/>

  <!-- Antena / Nó neural no topo da cabeça -->
  <line x1="32" y1="10" x2="32" y2="15" stroke="#2EE6C5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="9" r="2.5" fill="#2EE6C5"/>
  <circle cx="32" cy="9" r="1" fill="#FFFFFF"/>

  <!-- Orelhas / Fones de áudio laterais -->
  <rect x="11" y="26" width="4" height="12" rx="2" fill="#334155" stroke="#2EE6C5" stroke-width="1"/>
  <rect x="49" y="26" width="4" height="12" rx="2" fill="#334155" stroke="#2EE6C5" stroke-width="1"/>

  <!-- Cabeça do Robô (formato orgânico arredondado) -->
  <rect x="14" y="15" width="36" height="34" rx="16" fill="url(#bot-head)" stroke="#334155" stroke-width="1"/>

  <!-- Viseira de Vidro Escuro (OLED Screen) -->
  <rect x="17" y="20" width="30" height="22" rx="10" fill="url(#bot-visor)" stroke="#1E293B" stroke-width="1"/>
  <!-- Reflexo de luz sutil no canto da viseira -->
  <path d="M 20 23 Q 26 21 33 22" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Olhos LED Expressivos e Amigáveis (Arcos sorridentes em neon cyan) -->
  <path d="M 21.5 31 Q 25.5 26.5 29.5 31" fill="none" stroke="url(#eye-glow)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 34.5 31 Q 38.5 26.5 42.5 31" fill="none" stroke="url(#eye-glow)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Sorriso LED digital discreto -->
  <path d="M 29.5 37 Q 32 39 34.5 37" fill="none" stroke="#2EE6C5" stroke-width="2" stroke-linecap="round"/>
</svg>
